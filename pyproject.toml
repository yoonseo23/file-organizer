[project]
name = "file-organizer"
version = "0.1.0"
description = "~/Desktop, ~/Downloads 최상위 파일을 규칙에 따라 정리하는 macOS CLI 도구"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.12",
]

[project.scripts]
organize = "file_organizer.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/file_organizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
